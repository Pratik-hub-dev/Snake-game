<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game Pro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>🐍 Snake Game Pro</h1>

<div class="top-bar">

<div>
Score:
<span id="score">0</span>
</div>

<div>
High Score:
<span id="highScore">0</span>
</div>

<div>
Level:
<span id="level">1</span>
</div>

</div>

<canvas
id="gameCanvas"
width="400"
height="400">
</canvas>

<div class="buttons">

<button id="startBtn">
▶ Start
</button>

<button id="pauseBtn">
⏸ Pause
</button>

<button id="restartBtn">
🔄 Restart
</button>

</div>

<p class="info">
Use Arrow Keys to control the snake.
</p>

</div>

<script src="script.js"></script>

</body>
</html>
